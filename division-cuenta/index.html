<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>División de la cuenta</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18212f; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 480px); padding: 32px; border: 1px solid #e1e7f0; border-radius: 20px; background: white; box-shadow: 0 16px 45px #263b5b12; }
    .eyebrow { margin: 0 0 8px; color: #596de5; font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 5vw, 2.2rem); }
    .intro { margin: 0 0 24px; color: #647084; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #ccd5e2; border-radius: 10px; font: inherit; }
    input:focus { outline: 3px solid #596de533; border-color: #596de5; }
    button { width: 100%; margin-top: 4px; padding: 12px; border: 0; border-radius: 10px; background: #596de5; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #4659cf; }
    .result { margin-top: 22px; padding: 16px; border-radius: 12px; background: #f1f4ff; }
    .result h2 { margin: 0 0 10px; font-size: 1rem; }
    .result p { margin: 6px 0; }
    .error { color: #b42318; font-weight: 600; }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Ejercicio 3</p>
    <h1>División de la cuenta</h1>
    <p class="intro">Calcula la propina y cuánto debe pagar cada persona.</p>
    <form id="bill-form">
      <div class="field">
        <label for="bill-total">Total de la cuenta</label>
        <input id="bill-total" name="total" type="number" min="0" step="0.01" required placeholder="Ej. 80.00">
      </div>
      <div class="field">
        <label for="tip-percent">Porcentaje de propina (%)</label>
        <input id="tip-percent" name="tipPercent" type="number" min="0" step="any" required placeholder="Ej. 15">
      </div>
      <div class="field">
        <label for="people">Número de personas</label>
        <input id="people" name="people" type="number" min="1" step="1" required placeholder="Ej. 4">
      </div>
      <button type="submit">Dividir la cuenta</button>
    </form>
    <section id="result" class="result" aria-live="polite" hidden></section>
  </main>
</body>
</html>
