<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor de temperatura</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18212f; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 480px); padding: 32px; border: 1px solid #e1e7f0; border-radius: 20px; background: white; box-shadow: 0 16px 45px #263b5b12; }
    .eyebrow { margin: 0 0 8px; color: #596de5; font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 5vw, 2.2rem); }
    .intro { margin: 0 0 24px; color: #647084; }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #ccd5e2; border-radius: 10px; font: inherit; }
    input:focus { outline: 3px solid #596de533; border-color: #596de5; }
    button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px; background: #596de5; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #4659cf; }
    .result { margin-top: 22px; padding: 16px; border-radius: 12px; background: #f1f4ff; }
    .result h2 { margin: 0 0 10px; font-size: 1rem; }
    .result p { margin: 6px 0; }
    .error { color: #b42318; font-weight: 600; }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Ejercicio 1</p>
    <h1>Conversor de temperatura</h1>
    <p class="intro">Convierte grados Celsius a Fahrenheit y Kelvin.</p>
    <form id="temperature-form">
      <label for="celsius">Temperatura en Celsius (°C)</label>
      <input id="celsius" name="celsius" type="number" step="any" required placeholder="Ej. 25">
      <button type="submit">Convertir temperatura</button>
    </form>
    <section id="result" class="result" aria-live="polite" hidden></section>
  </main>
</body>
</html>
